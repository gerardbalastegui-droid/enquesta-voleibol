<title>Enquesta · Gestió d'equips de voleibol</title>
<style>
  :root{
    --bg:#FBF6F0;
    --card:#FFFFFF;
    --ink:#2C2521;
    --ink-soft:#6B5F56;
    --ink-faint:#9A8C81;
    --line:#E8DDD1;
    --line-strong:#D8C8B8;
    --accent:#C4623F;
    --accent-soft:#FBEDE6;
    --accent-ink:#8E3F24;
    --ok:#3F7A5E;
    --err:#B4402C;
    --radius:14px;
    --shadow:0 1px 2px rgba(44,37,33,.05), 0 8px 24px rgba(44,37,33,.06);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(251,246,240,.92);
    backdrop-filter:saturate(1.4) blur(8px);
    -webkit-backdrop-filter:saturate(1.4) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:640px;margin:0 auto;padding:10px 16px;
    display:flex;align-items:center;gap:12px;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px;letter-spacing:.01em;min-width:0}
  .brand span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brand-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
  .lang{display:flex;gap:4px;background:#F1E7DB;padding:3px;border-radius:999px}
  .lang button{
    appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);
    padding:5px 12px;border-radius:999px;transition:.15s;
  }
  .lang button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(44,37,33,.12)}
  .lang{flex:none}
  /* Amb tres idiomes, a pantalles estretes el selector s'ha de comprimir. */
  @media (max-width:400px){
    .lang button{padding:5px 8px;font-size:12.5px}
    .brand{font-size:13px}
  }
  .progress-track{height:3px;background:#EDE1D4}
  .progress-bar{height:100%;width:0;background:var(--accent);transition:width .3s ease}

  /* ---------- header ---------- */
  header.intro{padding:36px 0 8px}
  header.intro h1{font-size:27px;line-height:1.2;margin:0 0 12px;letter-spacing:-.02em;font-weight:700}
  header.intro p{margin:0;color:var(--ink-soft);font-size:15.5px}
  .meta-note{
    margin-top:16px;display:inline-flex;gap:8px;align-items:center;
    background:var(--accent-soft);color:var(--accent-ink);
    padding:7px 13px;border-radius:999px;font-size:13px;font-weight:550;
  }

  /* ---------- sections ---------- */
  section.sec{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 18px;margin-top:18px;box-shadow:var(--shadow);
  }
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .sec-num{
    font-size:12px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border-radius:6px;padding:2px 7px;flex:none;
  }
  .sec-head h2{font-size:18px;margin:0;letter-spacing:-.01em;font-weight:680}
  .sec-note{font-size:13.5px;color:var(--ink-faint);margin:8px 0 0;font-style:italic}

  /* ---------- questions ---------- */
  .q{padding:20px 0 0;border-top:1px solid var(--line);margin-top:20px}
  .q:first-of-type{border-top:0;margin-top:14px;padding-top:0}
  .q-label{display:block;font-weight:600;font-size:15.5px;margin-bottom:12px;line-height:1.4}
  .req{color:var(--accent);margin-left:2px}
  .optional{font-weight:400;color:var(--ink-faint);font-size:13.5px}
  .hint{display:block;font-weight:400;color:var(--ink-faint);font-size:13.5px;margin-top:3px}

  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{
    display:flex;align-items:flex-start;gap:11px;cursor:pointer;
    border:1px solid var(--line-strong);border-radius:10px;
    padding:11px 13px;background:#FEFCFA;transition:.13s;
  }
  .opt:active{transform:scale(.995)}
  .opt input{
    appearance:none;-webkit-appearance:none;margin:0;flex:none;
    width:19px;height:19px;border:1.5px solid var(--line-strong);background:#fff;
    display:grid;place-content:center;transition:.13s;margin-top:1px;
  }
  .opt input[type=radio]{border-radius:50%}
  .opt input[type=checkbox]{border-radius:5px}
  .opt input::after{content:"";width:9px;height:9px;transform:scale(0);transition:.13s;background:#fff}
  .opt input[type=radio]::after{border-radius:50%}
  .opt input[type=checkbox]::after{
    width:11px;height:11px;background:none;
    clip-path:polygon(14% 45%,0 60%,40% 100%,100% 22%,84% 8%,38% 70%);
  }
  .opt input[type=checkbox]::after{background:#fff}
  .opt input:checked{background:var(--accent);border-color:var(--accent)}
  .opt input:checked::after{transform:scale(1)}
  .opt input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
  .opt span{font-size:15px;line-height:1.4}

  /* text inputs */
  input[type=text],input[type=number],textarea{
    width:100%;font:inherit;font-size:16px;color:var(--ink);
    background:#FEFCFA;border:1px solid var(--line-strong);border-radius:10px;
    padding:11px 13px;transition:.13s;
  }
  textarea{min-height:96px;resize:vertical;line-height:1.5}
  input:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  input::placeholder,textarea::placeholder{color:var(--ink-faint)}
  .other-wrap{margin-top:8px;padding-left:2px}
  .other-wrap[hidden]{display:none}

  /* number pair */
  .pair{display:flex;gap:12px}
  .pair label{flex:1;display:block}
  .pair .pair-cap{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;font-weight:550}

  /* matrix */
  .matrix{display:flex;flex-direction:column;gap:14px}
  .mrow{border:1px solid var(--line);border-radius:11px;padding:13px;background:#FEFCFA}
  .mrow-label{font-weight:600;font-size:14.5px;margin-bottom:10px;line-height:1.35}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{position:relative;cursor:pointer}
  .pill input{position:absolute;opacity:0;width:0;height:0}
  .pill span{
    display:block;font-size:13.5px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line-strong);background:#fff;color:var(--ink-soft);
    transition:.13s;white-space:nowrap;
  }
  .pill input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
  .pill input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

  /* scale */
  .scale-row{display:flex;gap:7px}
  .scale-row .pill{flex:1}
  .scale-row .pill span{text-align:center;padding:12px 0;font-size:16px;font-weight:600;white-space:normal}
  .scale-ends{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:12.5px;color:var(--ink-faint)}
  .scale-ends span:last-child{text-align:right}

  /* validation */
  .q.invalid .q-label{color:var(--err)}
  .q.invalid .opt,.q.invalid .mrow,.q.invalid textarea,.q.invalid input[type=text]{border-color:var(--err)}
  .q-err{display:none;color:var(--err);font-size:13.5px;margin-top:9px;font-weight:550}
  .q.invalid .q-err{display:block}

  /* footer / submit */
  .foot{margin-top:24px}
  .btn{
    width:100%;appearance:none;border:0;cursor:pointer;font:inherit;
    font-size:16.5px;font-weight:650;color:#fff;background:var(--accent);
    padding:16px;border-radius:12px;transition:.15s;
    box-shadow:0 2px 8px rgba(196,98,63,.28);
  }
  .btn:hover{background:#B15636}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.6;cursor:default;transform:none}
  .form-err{
    display:none;margin-top:12px;padding:12px 14px;border-radius:10px;
    background:#FBE9E5;color:var(--err);font-size:14px;border:1px solid #F0CDC4;
  }
  .form-err.show{display:block}
  .privacy{margin-top:14px;text-align:center;font-size:13px;color:var(--ink-faint)}

  /* thanks */
  .thanks{text-align:center;padding:64px 20px}
  .thanks .mark{
    width:60px;height:60px;border-radius:50%;background:var(--accent-soft);
    color:var(--accent);display:grid;place-content:center;margin:0 auto 20px;font-size:29px;
  }
  .thanks h2{font-size:24px;margin:0 0 10px;letter-spacing:-.01em}
  .thanks p{color:var(--ink-soft);margin:0 auto;max-width:400px}
  .thanks .storage-note{margin-top:20px;font-size:12.5px;color:var(--ink-faint)}

  [hidden]{display:none !important}

  /* export view (only via #export) */
  #export-view{padding:24px 0}
  #export-view h2{font-size:18px;margin:0 0 8px}
  #export-view p{color:var(--ink-soft);font-size:14px;margin:0 0 14px}
  #export-view textarea{min-height:340px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}

  @media (min-width:600px){
    .wrap{padding-bottom:120px}
    section.sec{padding:24px 24px}
    header.intro h1{font-size:32px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

function uuid() {
  if (window.crypto && typeof crypto.randomUUID === "function") return crypto.randomUUID();
  const b = new Uint8Array(16);
  (window.crypto || {}).getRandomValues
    ? crypto.getRandomValues(b)
    : b.forEach((_, i) => (b[i] = Math.floor(Math.random() * 256)));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, "0"));
  return `${h.slice(0,4).join("")}-${h.slice(4,6).join("")}-${h.slice(6,8).join("")}-${h.slice(8,10).join("")}-${h.slice(10,16).join("")}`;
}

function el(tag, attrs, children) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k === "dataset") Object.assign(n.dataset, attrs[k]);
    else if (k in n && k !== "list") n[k] = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  (children || []).forEach((c) => n.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return n;
}

  const label = el("label", { class: "q-label" });
  label.appendChild(i18nSpan(q.label));
  if (q.required) label.appendChild(el("span", { class: "req" }, ["*"]));
  else {
    label.appendChild(document.createTextNode(" "));
    const opt = i18nSpan("optional", "optional");
    label.appendChild(el("span", { class: "optional" }, ["(", opt, ")"]));
  }
  if (q.hint) label.appendChild(i18nSpan(q.hint, "hint"));
  wrap.appendChild(label);

  const name = `q_${q.id}`;

  if (q.type === "radio" || q.type === "checkbox") {
    const opts = el("div", { class: "opts" });
    q.options.forEach((o) => {
      const input = el("input", { type: q.type, name: name, value: o.v });
      const row = el("label", { class: "opt" }, [input, i18nSpan(o.t)]);
      opts.appendChild(row);
      if (o.other) {
        const otherIn = el("input", {
          type: "text", class: "other-input",
          dataset: { otherFor: `${q.id}:${o.v}`, ph: o.otherPh || "other_ph" }
        });
        const ow = el("div", { class: "other-wrap", hidden: true }, [otherIn]);
        opts.appendChild(ow);
        input.addEventListener("change", () => { ow.hidden = !input.checked; if (input.checked) otherIn.focus(); });
        if (q.type === "radio") {
          opts.addEventListener("change", () => { if (!input.checked) ow.hidden = true; });
        }
      }
    });
    wrap.appendChild(opts);

  } else if (q.type === "text") {
    wrap.appendChild(el("input", { type: "text", name: name, dataset: { ph: q.placeholder || "" } }));

  } else if (q.type === "textarea") {
    wrap.appendChild(el("textarea", { name: name, rows: 4, dataset: { ph: q.placeholder || "" } }));

  } else if (q.type === "numberpair") {
    const pair = el("div", { class: "pair" });
    q.fields.forEach((f) => {
      const cap = i18nSpan(f.cap, "pair-cap");
      const input = el("input", { type: "number", min: "0", step: "1", name: `${name}_${f.id}`, inputMode: "numeric" });
      pair.appendChild(el("label", {}, [cap, input]));
    });
    wrap.appendChild(pair);

  } else if (q.type === "scale") {
    const row = el("div", { class: "scale-row" });
    for (let i = 1; i <= 5; i++) {
      const input = el("input", { type: "radio", name: name, value: String(i) });
      row.appendChild(el("label", { class: "pill" }, [input, el("span", {}, [String(i)])]));
    }
    wrap.appendChild(row);
    wrap.appendChild(el("div", { class: "scale-ends" }, [i18nSpan(q.low), i18nSpan(q.high)]));

  } else if (q.type === "matrix") {
    const m = el("div", { class: "matrix" });
    q.rows.forEach((r) => {
      const rowName = `${name}_${r.id}`;
      const pills = el("div", { class: "pills" });
      const box = el("div", { class: "mrow" }, [i18nSpan(r.t, "mrow-label"), pills]);
      box.dataset.rowId = r.id;
      const cellType = q.multi ? "checkbox" : "radio";
      q.options.forEach((o) => {
        const input = el("input", { type: cellType, name: rowName, value: o.v });
        pills.appendChild(el("label", { class: "pill" }, [input, i18nSpan(o.t)]));

        // "Res" és excloent: marcar-la desmarca la resta, i a l'inrevés.
        if (q.multi) {
          input.addEventListener("change", () => {
            if (!input.checked) return;
            const all = [...pills.querySelectorAll("input")];
            if (o.exclusive) all.forEach((x) => { if (x !== input) x.checked = false; });
            else all.forEach((x) => {
              const def = q.options.find((z) => z.v === x.value);
              if (def && def.exclusive) x.checked = false;
            });
            box.dispatchEvent(new Event("change", { bubbles: true }));
          });
        }

        if (o.other) {
          const otherIn = el("input", {
            type: "text", class: "other-input",
            dataset: { otherFor: `${q.id}.${r.id}:${o.v}`, ph: o.otherPh || "other_ph" }
          });
          const ow = el("div", { class: "other-wrap", hidden: true }, [otherIn]);
          box.appendChild(ow);
          box.addEventListener("change", () => {
            ow.hidden = !input.checked;
            if (input.checked && document.activeElement !== otherIn) otherIn.focus();
          });
        }
      });
      m.appendChild(box);
    });
    wrap.appendChild(m);
  }

  wrap.appendChild(i18nSpan("err_required", "q-err"));
  questionIndex[q.id] = { def: q, node: wrap };
  return wrap;
}

SCHEMA.forEach((sec, si) => {
  const secEl = el("section", { class: "sec", id: `sec-${sec.id}` });
  secEl.appendChild(el("div", { class: "sec-head" }, [
    el("span", { class: "sec-num" }, [String(si + 1)]),
    el("h2", {}, [i18nSpan(sec.title)])
  ]));
  if (sec.note) secEl.appendChild(el("p", { class: "sec-note" }, [i18nSpan(sec.note)]));
  sec.questions.forEach((q) => secEl.appendChild(buildQuestion(q)));
  sectionsEl.appendChild(secEl);
  sec._node = secEl;
});

/* ============================================================================
   Lectura de respostes
   ========================================================================== */
function otherValue(sel) {
  const n = document.querySelector(`.other-input[data-other-for="${sel}"]`);
  return n ? n.value.trim() : "";
}

function readQuestion(q) {
  const name = `q_${q.id}`;
  if (q.type === "radio") {
    const c = form.querySelector(`input[name="${name}"]:checked`);
    if (!c) return null;
    const opt = q.options.find((o) => o.v === c.value);
    const res = { value: c.value };
    if (opt && opt.other) res.other = otherValue(`${q.id}:${c.value}`);
    return res;
  }
  if (q.type === "checkbox") {
    const checked = [...form.querySelectorAll(`input[name="${name}"]:checked`)];
    if (!checked.length) return null;
    const res = { values: checked.map((c) => c.value) };
    checked.forEach((c) => {
      const opt = q.options.find((o) => o.v === c.value);
      if (opt && opt.other) { res.other = res.other || {}; res.other[c.value] = otherValue(`${q.id}:${c.value}`); }
    });
    return res;
  }
  if (q.type === "scale") {
    const c = form.querySelector(`input[name="${name}"]:checked`);
    return c ? { value: Number(c.value) } : null;
  }
  if (q.type === "text" || q.type === "textarea") {
    const n = form.querySelector(`[name="${name}"]`);
    const v = n ? n.value.trim() : "";
    return v ? { value: v } : null;
  }
  if (q.type === "numberpair") {
    const out = {};
    let any = false;
    q.fields.forEach((f) => {
      const n = form.querySelector(`[name="${name}_${f.id}"]`);
      const v = n && n.value !== "" ? Number(n.value) : null;
      out[f.id] = v;
      if (v !== null && !Number.isNaN(v)) any = true;
    });
    return any ? out : null;
  }
  if (q.type === "matrix") {
    const out = {};
    let filled = 0;
    q.rows.forEach((r) => {
      const checked = [...form.querySelectorAll(`input[name="${name}_${r.id}"]:checked`)];
      if (!checked.length) { out[r.id] = null; return; }
      filled++;
      const cell = q.multi ? { values: checked.map((c) => c.value) } : { value: checked[0].value };
      checked.forEach((c) => {
        const opt = q.options.find((o) => o.v === c.value);
        if (!opt || !opt.other) return;
        const txt = otherValue(`${q.id}.${r.id}:${c.value}`);
        if (q.multi) { cell.other = cell.other || {}; cell.other[c.value] = txt; }
        else cell.other = txt;
      });
      out[r.id] = cell;
    });
    return filled === q.rows.length ? out : (filled ? { _partial: true, ...out } : null);
  }
  return null;
}

function readAll() {
  const a = {};
  SCHEMA.forEach((s) => s.questions.forEach((q) => { a[q.id] = readQuestion(q); }));
  return a;
}

/* ============================================================================
   Visibilitat condicional + progrés
   ========================================================================== */
function isSectionVisible(sec, answers) { return !sec.showIf || !!sec.showIf(answers); }
function isQuestionVisible(sec, q, answers) {
  return isSectionVisible(sec, answers) && (!q.showIf || !!q.showIf(answers));
}

function isAnswered(q, ans) {
  const v = ans[q.id];
  if (v === null || v === undefined) return false;
  if (q.type === "matrix") return !v._partial;
  return true;
}

function refresh() {
  const answers = readAll();
  let total = 0, done = 0;

  SCHEMA.forEach((sec) => {
    const secVisible = isSectionVisible(sec, answers);
    sec._node.hidden = !secVisible;
    sec.questions.forEach((q) => {
      const vis = isQuestionVisible(sec, q, answers);
      questionIndex[q.id].node.hidden = !vis;
      if (vis && q.required) { total++; if (isAnswered(q, answers)) done++; }
    });
  });

  // renumera les seccions visibles
  let n = 0;
  SCHEMA.forEach((sec) => {
    if (sec._node.hidden) return;
    n++;
    sec._node.querySelector(".sec-num").textContent = String(n);
  });

  progressBar.style.width = total ? `${Math.round((done / total) * 100)}%` : "0%";
  progressBar.parentElement.setAttribute("role", "progressbar");
  progressBar.parentElement.setAttribute("aria-valuenow", total ? Math.round((done / total) * 100) : 0);
  progressBar.parentElement.setAttribute("aria-valuemin", "0");
  progressBar.parentElement.setAttribute("aria-valuemax", "100");
  progressBar.parentElement.setAttribute("aria-label", t("progress_label"));
  return answers;
}

form.addEventListener("input", () => refresh());
form.addEventListener("change", () => refresh());

/* ============================================================================
   Validació
   ========================================================================== */
function validate() {
  const answers = readAll();
  let first = null;

  SCHEMA.forEach((sec) => {
    sec.questions.forEach((q) => {
      const node = questionIndex[q.id].node;
      node.classList.remove("invalid");
      if (!isQuestionVisible(sec, q, answers) || !q.required) return;

      let bad = !isAnswered(q, answers);

      // matriu: si una fila usa una opció amb text lliure ("app"), cal especificar-la
      if (!bad && q.type === "matrix") {
        q.rows.forEach((r) => {
          const cell = answers[q.id][r.id];
          if (!cell) return;
          const chosen = cell.values || [cell.value];
          chosen.forEach((v) => {
            const opt = q.options.find((o) => o.v === v);
            if (!opt || !opt.other) return;
            const txt = cell.values ? (cell.other || {})[v] : cell.other;
            if (!txt) bad = true;
          });
        });
      }

      // si s'ha triat una opció "altres", cal el text
      if (!bad && (q.type === "radio" || q.type === "checkbox")) {
        const chosen = q.type === "radio" ? [answers[q.id].value] : answers[q.id].values;
        chosen.forEach((v) => {
          const opt = q.options.find((o) => o.v === v);
          if (opt && opt.other) {
            const txt = q.type === "radio" ? answers[q.id].other : (answers[q.id].other || {})[v];
            if (!txt) bad = true;
          }
        });
      }

      if (bad) {
        node.classList.add("invalid");
        const errNode = node.querySelector(".q-err");
        errNode.dataset.i18n = isAnswered(q, answers) ? "err_other" : "err_required";
        errNode.textContent = t(errNode.dataset.i18n);
        if (!first) first = node;
      }
    });
  });

  return { ok: !first, first, answers };
}

/* ============================================================================
   Desat de respostes
   ========================================================================== */
function storageApi() {
  const s = window.storage || (window.claude && window.claude.storage);
  return (s && typeof s.set === "function") ? s : null;
}

// Còpia de seguretat al navegador. Sempre que es pugui, perquè cap resposta
// es perdi encara que el backend falli. Es pot recuperar amb #export.
function saveLocalCopy(key, record) {
  try {
    localStorage.setItem(key, JSON.stringify(record));
    const idx = JSON.parse(localStorage.getItem("respuestas:index") || "[]");
    if (idx.indexOf(key) === -1) idx.push(key);
    localStorage.setItem("respuestas:index", JSON.stringify(idx));
    return true;
  } catch (e) {
    return false;
  }
}

async function postToEndpoint(record) {
  // La primera petició després d'una estona pot trigar 10-15 s (arrencada en fred
  // d'Apps Script). Donem marge, però no ens hi quedem penjats per sempre.
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 45000);

  let res;
  try {
    // text/plain evita el preflight CORS, que els web apps d'Apps Script no responen.
    res = await fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(record),
      redirect: "follow",
      signal: ctl.signal
    });
  } finally {
    clearTimeout(timer);
  }
  if (!res.ok) throw new Error("http-" + res.status);

  // Si la resposta no es pot llegir (redirecció opaca), donem el POST per bo:
  // només fallem quan el backend diu explícitament que ha anat malament.
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (data && data.ok === false) throw new Error(data.error || "backend-error");
}

async function saveResponse(record) {
  const key = `respuestas:${record.id}`;

  if (ENDPOINT) {
    try {
      await postToEndpoint(record);
    } catch (e) {
      saveLocalCopy(key, record);   // no la perdem, però avisem
      throw e;
    }
    saveLocalCopy(key, record);
    return "backend";
  }

  const api = storageApi();
  if (api) {
    await api.set(key, JSON.stringify(record), { shared: true });
    return "shared";
  }

  if (saveLocalCopy(key, record)) return "local";
  throw new Error("no-storage");
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  formErr.classList.remove("show");

  const { ok, first, answers } = validate();
  if (!ok) {
    formErr.dataset.i18n = "err_form";
    formErr.textContent = t("err_form");
    formErr.classList.add("show");
    first.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  // Neteja: només les preguntes visibles entren al registre.
  const visible = {};
  SCHEMA.forEach((sec) => sec.questions.forEach((q) => {
    if (isQuestionVisible(sec, q, answers) && answers[q.id] !== null) visible[q.id] = answers[q.id];
  }));

  // L'id es genera un cop per formulari omplert i es reutilitza en els reintents,
  // perquè un enviament que falla a mitges no acabi generant dues files.
  if (!pendingId) pendingId = uuid();

  const record = {
    id: pendingId,
    timestamp: new Date().toISOString(),
    // Súbelo a mano si cambias preguntas u opciones con respuestas ya recogidas.
    // Ver README.md > "Sube versio_formulari si cambias las preguntas".
    versio_formulari: 1,
    idioma: lang,
    respostes: visible
  };

  submitBtn.disabled = true;
  submitBtn.textContent = t("submitting");

  try {
    const where = await saveResponse(record);
    document.getElementById("form-view").hidden = true;
    document.getElementById("thanks-view").hidden = false;
    const note = document.getElementById("storage-note");
    if (where === "local") { note.dataset.i18n = "saved_local"; note.textContent = t("saved_local"); }
    else { delete note.dataset.i18n; note.textContent = ""; }
    progressBar.style.width = "100%";
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (e) {
    console.error("Error desant la resposta:", e);
    formErr.dataset.i18n = "err_save";
    formErr.textContent = t("err_save");
    formErr.classList.add("show");
    submitBtn.disabled = false;
    submitBtn.textContent = t("submit");
  }
});

/* ============================================================================
   Canvi d'idioma
   ========================================================================== */
function applyLang() {
  document.documentElement.lang = t("lang_attr");
  document.title = t("doc_title");

  document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
  document.querySelectorAll("[data-ph]").forEach((n) => {
    const k = n.dataset.ph;
    n.placeholder = k ? t(k) : "";
  });
  document.querySelectorAll(".other-input").forEach((n) => { n.placeholder = t(n.dataset.ph || "other_ph"); });

  document.querySelectorAll(".lang button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });

  if (!submitBtn.disabled) submitBtn.textContent = t("submit");
  refresh();
}

document.querySelectorAll(".lang button").forEach((b) => {
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("enquesta:lang", lang); } catch (e) {}
    applyLang();
  });
});

try {
  const saved = localStorage.getItem("enquesta:lang");
  if (saved && T[saved]) lang = saved;
  else {
    // "ca" és el valor per defecte; només el canviem si el navegador diu una
    // altra cosa. Un navegador en català ("ca", "ca-ES") ja hi cau tot sol.
    const nav = (navigator.language || "").toLowerCase();
    if (nav.startsWith("de")) lang = "de";
    else if (nav.startsWith("es")) lang = "es";
  }
} catch (e) {}

/* ============================================================================
   Vista d'exportació (#export) — només respostes locals d'aquest navegador
   ========================================================================== */
function maybeExport() {
  const on = location.hash === "#export";
  document.getElementById("export-view").hidden = !on;
  document.getElementById("form-view").hidden = on || !document.getElementById("thanks-view").hidden;
  if (!on) return;
  let rows = [];
  try {
    const idx = JSON.parse(localStorage.getItem("respuestas:index") || "[]");
    rows = idx.map((k) => JSON.parse(localStorage.getItem(k) || "null")).filter(Boolean);
  } catch (e) {}
  document.getElementById("export-box").value = JSON.stringify(rows, null, 2);
}
window.addEventListener("hashchange", maybeExport);

applyLang();
maybeExport();
</script>
